<body id="top">

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-logo">BoilerMatch</div>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="interests.html">Interests</a></li>

      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="container">

    <!-- Page Header -->
    <header class="header">
      <h1>BoilerMatch</h1>
      <p>Find your perfect club at Purdue!</p>
    </header>

    <!-- Form Section -->
    <section>
      <h2>Add a Club</h2>
      <p class="subtext">Submit a club to be added</p>

      <form action="submit.php" method="POST">

        <div class="form-group">
          <label for="club-name">Club Name</label>
          <input type="text" id="club-name" name="club-name" placeholder="e.g. Purdue Chess Club" required>
        </div>

        <div class="form-group">
          <label for="club-members">Members</label>
          <input type="text" id="club-members" name="club-members" placeholder="e.g. 150 members" required>
          <div class="form-hint">Enter approximate number of members</div>
        </div>

        <div class="form-group">
          <label for="club-time">Meeting Time</label>
          <input type="text" id="club-time" name="club-time" placeholder="e.g. Tuesdays 6 PM" required>
        </div>

        <div class="form-group">
          <label for="club-tags">Tags</label>
          <input type="text" id="club-tags" name="club-tags" placeholder="e.g. Technology, Fitness, Entertainment"
            required>
          <div class="form-hint">Separate tags with commas</div>
        </div>

        <div class="form-group">
          <label for="club-desc">Description</label>
          <textarea id="club-desc" name="club-desc" placeholder="Describe important information about your club..."
            required></textarea>
        </div>

        <button type="submit" class="match-btn">Submit</button>

      </form>
    </section>

  </main>

  <!-- Back to Top Button -->
  <a href="#top" class="back-to-top">⬆</a>

  <script src="script.js"></script>
</body>

</html>
